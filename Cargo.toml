[package]
name = "alpha"
version = "0.1.0"
edition = "2024"
description = "A light, minimal markdown writing app"
license = "MIT"

[dependencies]
gpui = "=0.2.2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
cocoa = "0.26"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
