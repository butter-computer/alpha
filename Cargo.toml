[package]
name = "alpha"
version = "0.2.0"
edition = "2024"
description = "A light, minimal markdown writing app"
license = "MIT"

[dependencies]
gpui = "=0.2.2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# gpui with a patched macOS Metal renderer (progressive edge blur). See vendor/README.md.
[patch.crates-io]
gpui = { path = "vendor/gpui" }
