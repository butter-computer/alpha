<!doctype html>
<meta charset="utf-8">
<title>Alpha icon · variant 2 playground</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#30241e;color:#d9c3a0;font:13px/1.4 -apple-system,Helvetica,sans-serif;display:flex;min-height:100vh}
  aside{width:290px;height:100vh;overflow:auto;position:sticky;top:0;padding:26px 22px;background:#271d18;border-right:1px solid #1c1411;flex:none;box-sizing:border-box}
  h1{font:500 20px Georgia,serif;color:#ead6a8;margin:0 0 4px}.sub{color:#a58a69;margin:0 0 22px}
  label{display:block;margin:14px 0 5px;color:#a58a69;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  label b{float:right;color:#d9c3a0;font-weight:500;letter-spacing:0}
  select,input[type=text]{width:100%;box-sizing:border-box;background:#3a2b24;color:#ead6a8;border:1px solid #1c1411;border-radius:8px;padding:8px 10px;font:inherit}
  input[type=range]{width:100%;accent-color:#c5a16d}.row{display:flex;gap:8px}.row>*{flex:1}
  button{background:#c5a16d;color:#2a1d18;border:0;border-radius:8px;padding:9px 12px;font:600 13px inherit;cursor:pointer}
  button.ghost{background:#3a2b24;color:#d9c3a0}.btns{display:flex;gap:8px;margin-top:22px}
  .chk{display:flex;gap:8px;align-items:center;margin-top:16px;color:#d9c3a0;font-size:13px;text-transform:none;letter-spacing:0}
  main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
  #out{width:min(560px,calc(100vw - 360px),80vh);height:auto;aspect-ratio:1}
  .small{display:flex;gap:24px;align-items:center}.small span{font-size:11px;color:#8a7258;letter-spacing:.06em}
  #status{color:#a58a69;font-size:12px;min-height:1em}
  canvas:not(#out){position:absolute;left:-99999px;top:0}
  .hint{margin-top:18px;color:#7a6550;font-size:11px}
</style>
<aside>
  <h1>Variant 2 playground</h1><p class="sub">Rosewood oval · pick a letterform</p>
  <label>Font</label><select id="font"></select>
  <div class="row"><div><label>Weight</label><select id="weight"></select></div><div><label>Letter</label><input id="char" type="text" value="a" maxlength="1"></div></div>
  <label>Centering</label>
  <select id="center"><option value="blend">Optical (blend)</option><option value="centroid">Visual mass (centroid)</option><option value="bbox">Bounding box</option></select>
  <label>Size <b id="size-v">560</b></label><input id="size" type="range" min="360" max="760" value="560">
  <label>Nudge X <b id="dx-v">0</b></label><input id="dx" type="range" min="-80" max="80" value="0">
  <label>Nudge Y <b id="dy-v">0</b></label><input id="dy" type="range" min="-80" max="80" value="0">
  <label>Grain angle <b id="angle-v">83</b></label><input id="angle" type="range" min="-90" max="90" value="83">
  <label>Grain seed <b id="seed-v">41</b></label><input id="seed" type="range" min="1" max="99" value="41">
  <label class="chk"><input id="ring" type="checkbox" checked> Banded oval ring</label>
  <div class="btns"><button id="dl">Download PNG</button><button id="reset" class="ghost">Reset</button></div>
  <div class="hint">↑ / ↓ cycles fonts. Each render takes a few seconds.</div>
</aside>
<main>
  <canvas id="out" width="1024" height="1024"></canvas>
  <div class="small"><img id="p128" width="128"><img id="p64" width="64"><img id="p32" width="32"><span>128 · 64 · 32</span></div>
  <div id="status">starting…</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/p5.brush@2.2.3/dist/p5.brush.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<script>
(() => {
  let t = (1517673520 >>> 0);
  Math.random = () => { t += 0x6D2B79F5; let r = Math.imul(t ^ (t >>> 15), 1 | t); r ^= r + Math.imul(r ^ (r >>> 7), 61 | r); return ((r ^ (r >>> 14)) >>> 0) / 4294967296; };
})();
</script>
<script src="helpers.js"></script>
<script src="inlay.js"></script>
<script src="interactive.js"></script>
