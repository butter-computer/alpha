<!doctype html>
<meta charset="utf-8">
<title>alpha icon generator</title>
<style>html,body{margin:0;background:#888}canvas{display:block}</style>
<!-- Versions pinned: p5 2.x + p5.brush 2.x run in WEBGL mode. -->
<script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/p5.brush@2.2.3/dist/p5.brush.js"></script>
<script src="https://cdn.jsdelivr.net/npm/polygon-clipping@0.15.7/dist/polygon-clipping.umd.min.js"></script>
<script>
// Pin every source of randomness (same preamble as the marquetry-veneer sketch); ?seed=N overrides.
(() => {
  const seed = Number(new URLSearchParams(location.search).get("seed") || 1517673520);
  let t = (seed >>> 0);
  const next = () => { t += 0x6D2B79F5; let r = Math.imul(t ^ (t >>> 15), 1 | t); r ^= r + Math.imul(r ^ (r >>> 7), 61 | r); return ((r ^ (r >>> 14)) >>> 0) / 4294967296; };
  Math.random = next;
  window.WORK_SEED = seed;
  p5.registerAddon((p5, fn, lifecycles) => {
    lifecycles.presetup = function () { this.randomSeed(window.WORK_SEED); this.noiseSeed(window.WORK_SEED); };
  });
})();
</script>
<script src="glyph.js"></script>
<script src="helpers.js"></script>
<script src="parquet.js"></script>
<script src="inlay.js"></script>
<script src="variants.js"></script>
<script src="main.js"></script>
